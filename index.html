<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opportunity Finder</title>
<style>
  :root {
    --ink: #14213d;
    --paper: #f7f5ef;
    --card: #ffffff;
    --line: #d9d4c7;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2rem; margin: 0 0 8px; }
  .lead { margin: 0 0 28px; color: #4a5568; max-width: 52ch; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 18px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: .95rem; }
  .hint { font-weight: 400; color: #5b6574; font-size: .85rem; }
  input, select, textarea {
    font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink); width: 100%;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 1px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  button {
    font: inherit; font-weight: 600; padding: 12px 18px; border: 0; border-radius: 6px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button[disabled] { opacity: .6; cursor: progress; }
  .status { margin-top: 16px; padding: 14px 16px; border-radius: 8px; display: none; }
  .status.ok { display: block; background: #e3f1ec; border: 1px solid var(--accent); }
  .status.err { display: block; background: #fbe9e7; border: 1px solid var(--error); color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Opportunity Finder</h1>
  <p class="lead">Tell us about your degree, skills and interests. A mentor reviews your matches and emails you the shortlist.</p>

  <form id="f" novalidate>
    <div class="row">
      <label>Name
        <input name="field-0" type="text" required autocomplete="name">
      </label>
      <label>Email
        <input name="field-1" type="email" required autocomplete="email">
      </label>
    </div>

    <div class="row">
      <label>Degree
        <select name="field-2" required>
          <option value="" disabled selected>Select your degree</option>
          <option>BS CS</option>
          <option>BS SE</option>
          <option>BS AI</option>
          <option>BS DS</option>
          <option>BBA</option>
          <option>Other</option>
        </select>
      </label>
      <label>CGPA
        <input name="field-3" type="number" step="0.01" min="0" max="4" required inputmode="decimal">
      </label>
    </div>

    <label>Skills
      <textarea name="field-4" required placeholder="Python, React, n8n"></textarea>
    </label>

    <label>Interests
      <textarea name="field-5" required placeholder="AI, web development"></textarea>
    </label>

    <div class="row">
      <label>Preferred type
        <select name="field-6" required>
          <option>Any</option>
          <option>Internship</option>
          <option>Scholarship</option>
          <option>Hackathon</option>
        </select>
      </label>
      <label>Location <span class="hint">optional</span>
        <input name="field-7" type="text" autocomplete="address-level2">
      </label>
    </div>

    <button type="submit" id="btn">Find my opportunities</button>
  </form>

  <div id="status" class="status" role="status" aria-live="polite"></div>
</main>

<script>
  // Paste your n8n PRODUCTION form URL here (the workflow must be Active).
  // Example: https://your-address.alternatefutures.ai/form/your-form-path
  const FORM_URL = "https://abhi486950.app.n8n.cloud/form/283a62d8-587e-4017-a8e6-f77493c96a25";

  const form = document.getElementById("f");
  const btn = document.getElementById("btn");
  const statusEl = document.getElementById("status");

  function show(kind, text) {
    statusEl.className = "status " + kind;
    statusEl.textContent = text;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    if (FORM_URL.startsWith("PASTE_")) {
      show("err", "Set FORM_URL in the file to your n8n Production form URL first.");
      return;
    }
    btn.disabled = true;
    btn.textContent = "Sending...";
    try {
      // no-cors: the request reaches n8n and triggers the workflow,
      // but the browser cannot read n8n's reply.
      await fetch(FORM_URL, { method: "POST", mode: "no-cors", body: new FormData(form) });
      form.reset();
      show("ok", "Thanks! A mentor will review your matches and email you.");
    } catch (err) {
      show("err", "The form could not be sent. Check your connection and the form URL, then try again.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Find my opportunities";
    }
  });
</script>
</body>
</html>
